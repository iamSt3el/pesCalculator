# Keeps the Render free instance awake during working hours.
#
# Render spins a free service down after ~15 minutes of inactivity, and the
# cold start costs the next visitor 50 seconds or more. Pinging the health
# endpoint keeps it up while anyone might actually use it, and lets it sleep
# overnight so the 750 free instance-hours a month are not spent idling.
#
# Set the service URL first:
#   Repo → Settings → Secrets and variables → Actions → Variables → New
#   Name: RENDER_URL   Value: https://<your-service>.onrender.com

name: Keep warm

on:
  schedule:
    # Every 5 minutes, 03:00-14:59 UTC = 08:30-20:29 IST, Monday to Saturday.
    # GitHub's scheduler runs late under load, so 5 minutes leaves room to
    # still land inside Render's 15-minute idle window.
    - cron: '*/5 3-14 * * 1-6'
  workflow_dispatch:        # lets you run it by hand to check the setup

concurrency:
  group: keep-warm
  cancel-in-progress: true  # a queued backlog serves no purpose

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::warning::RENDER_URL variable is not set — nothing to ping."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi

          # --max-time 90 tolerates a cold start that is already under way.
          # --retry covers a service still booting when the first attempt lands.
          status=$(curl --silent --show-error --location \
                        --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors \
                        --output /dev/null --write-out '%{http_code}' \
                        "${RENDER_URL%/}/api/health") || status="000"

          echo "GET ${RENDER_URL%/}/api/health -> $status"

          if [ "$status" != "200" ]; then
            echo "::error::Health check returned $status"
            exit 1
          fi
