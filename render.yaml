services:
  - type: web
    name: pes-calculator
    runtime: node
    plan: free
    region: singapore          # closest Render region to India
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and the build tools (tsc, vite) live there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Paste the Neon POOLED connection string here in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and kept; changing it signs everyone out.
      - key: SESSION_SECRET
        generateValue: true
      # Razorpay. All six or none: with none set, nobody is limited.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_HALF_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_YEARLY
        sync: false
